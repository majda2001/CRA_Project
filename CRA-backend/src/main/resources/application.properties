spring.application.name=CRA-backend
spring.config.import=optional:file:.env[.properties],optional:file:./CRA-backend/.env[.properties],optional:file:../CRA-backend/.env[.properties]

# Business timezone
app.timezone=Europe/Paris

# H2 Console
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Configuration
cra.app.jwtSecret=${JWT_SECRET}
cra.app.jwtExpirationMs=900000 
# 15 minutes = 900000 ms
cra.app.jwtRefreshExpirationMs=86400000 
# 24 heures = 86400000 ms

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin bootstrap configuration
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Frontend invitation link base URL
app.frontend.activation-url=${FRONTEND_ACTIVATION_URL:http://localhost:4200/activate-account}

# CRA constraints window (default: 22..28)
cra.submission.window.start-day=${CRA_WINDOW_START_DAY:22}
cra.submission.window.end-day=${CRA_WINDOW_END_DAY:28}
